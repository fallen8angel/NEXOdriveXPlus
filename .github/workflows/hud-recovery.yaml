name: HUD NCM recovery and protected package
on:
  push:
    branches: [NEXO, fix/jetson-hud-ncm-recovery-20261028, codex/hud-transient-gap-recovery]
  pull_request:
    branches: [NEXO]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional full SHA already contained in NEXO; blank builds current NEXO'
        required: false
        default: ''
        type: string
# New HEAD supersedes older, still-running builds. Do not keep dozens of
# competing protected releases in flight on every rapid NEXO code change.
# Dispatch is independent so a specifically requested historical audit is
# not cancelled by an ordinary branch push.
concurrency:
  group: nexo-hud-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/opendbc_repo'
      CARROT_JETSON: /tmp/carrot-jetson
      NEXO_TEST_FFMPEG: /usr/bin/ffmpeg
    steps:
      - name: Validate source selector
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SOURCE" && ! "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Resolve tested source commit
        id: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git fetch --no-tags origin NEXO
            git merge-base --is-ancestor "$source_sha" origin/NEXO
          fi
          echo "commit=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --retries 3 --timeout 30 pytest pytest-asyncio aiohttp numpy pillow pycapnp cffi psutil pyzmq zstandard opencv-python-headless onnx onnxruntime==1.23.2 pyusb raylib pyserial pycryptodome av
      - name: Install system test dependencies
        timeout-minutes: 25
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg xvfb xauth iproute2 iptables iputils-ping
      - name: Prepare pinned Jetson vendor
        timeout-minutes: 5
        run: |
          git clone --filter=blob:none https://github.com/ajouatom/carrot-jetson.git "$CARROT_JETSON"
          git -C "$CARROT_JETSON" checkout d0dc96fa32410403dfb2fefff3e2909c11ec109b
      - name: Verify protected source paths and model unchanged
        run: |
          git diff --exit-code 4eabb4a77f14842c38586a36f27dad05d9b47f1c HEAD -- openpilot/selfdrive/controls openpilot/selfdrive/monitoring openpilot/selfdrive/modeld/models opendbc_repo panda
          git diff --check 4eabb4a77f14842c38586a36f27dad05d9b47f1c HEAD
      - name: Test handoff, expiry, reconnect, recovery and protected rollback
        run: >-
          python -m pytest -q -ra -o addopts='' -o asyncio_mode=auto
          --confcutdir=openpilot/tools/jetson/tests
          --ignore=openpilot/tools/jetson/tests/test_runtime_imports.py
          openpilot/tools/jetson/tests
          openpilot/selfdrive/modeld/tests/test_jetlink_ncm_transport.py
          openpilot/selfdrive/modeld/tests/test_jetlink_display.py
          openpilot/selfdrive/modeld/tests/test_jetlink_startup.py
          openpilot/common/tests/test_jetson_status.py
          openpilot/selfdrive/modeld/tests/test_jetlink_ncm_server.py
          openpilot/selfdrive/carrot/tests/test_cluster_software_h264_mirror.py
          openpilot/selfdrive/carrot/tests/test_cluster_ffmpeg_threads.py
          openpilot/selfdrive/carrot/server/tests/test_diagnostic_capture.py
          openpilot/selfdrive/carrot/server/tests/test_nexo_hud_link_log.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_updater.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_check_diagnostics.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_performance.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_ai_performance.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_bundle_api.py
          openpilot/selfdrive/carrot/server/tests/test_feature_imports.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_stage_labels.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_local_status.py
          openpilot/selfdrive/carrot/server/tests/test_safe_git_pull.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_clock_sync.py
          openpilot/selfdrive/carrot/server/tests/test_hud_update_safety.py
          openpilot/tools/jetson/tests/test_hud_park_mode.py
          --junitxml=hud-recovery-results.xml
      - name: Verify existing live cluster and vehicle scene
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=openpilot/selfdrive/carrot/tests
          openpilot/selfdrive/carrot/tests/test_cluster_live.py
          openpilot/selfdrive/carrot/tests/test_cluster_scene.py
      - name: Verify real LTE gateway packets in isolated network namespaces
        run: >-
          sudo env "PYTHONPATH=$PYTHONPATH" unshare --mount --net --propagation private
          "$(command -v python)" -m pytest -q -o addopts=''
          --confcutdir=openpilot/tools/jetson/tests
          openpilot/tools/jetson/tests/verify_lte_namespace.py
      - name: Render tracked vehicle meshes and verify actual framebuffer pixels
        run: >-
          xvfb-run -a python -m pytest -q -o addopts='' --confcutdir=openpilot/selfdrive/carrot/tests
          openpilot/selfdrive/carrot/tests/test_cluster_sedan.py
          openpilot/selfdrive/carrot/tests/test_cluster_nexo_ego.py
          openpilot/selfdrive/carrot/tests/test_jetson_gear_frames.py
          openpilot/selfdrive/carrot/server/tests/test_settings_schema.py
      - name: Local TCP soak and software H264 encoder (not physical USB)
        run: python -m openpilot.tools.jetson.bench_hud_local --seconds 120 --output hud-recovery-soak.json
      - name: Build protected DATA update from tested commit
        run: |
          mkdir -p package
          python -m openpilot.tools.jetson.build_protected_bundle --carrot "$CARROT_JETSON" --compact package/nexo-hud-recovery.tar.gz
          cp openpilot/tools/jetson/protected_install.py openpilot/tools/jetson/protected_ncm.py openpilot/tools/jetson/install_hud_update.py package/
          cd package
          sha256sum * > SHA256SUMS
      - name: Import the extracted deployment in isolation (no physical USB)
        run: |
          mkdir -p /tmp/nexo-candidate /tmp/nexo-import-check
          tar -xzf package/nexo-hud-recovery.tar.gz -C /tmp/nexo-candidate
          test -s /tmp/nexo-candidate/openpilot/selfdrive/carrot/cluster/assets/models/sedan.obj
          test -s /tmp/nexo-candidate/openpilot/tools/jetson/nexo_park.jpg
          cd /tmp/nexo-import-check
          python -I /tmp/nexo-candidate/openpilot/tools/jetson/protected_probe.py /tmp/nexo-import-check --software-only
      - name: Build Windows transfer ZIP
        run: python -m openpilot.tools.jetson.build_hud_update --carrot "$CARROT_JETSON" package/NEXO-Jetson-HUD-repair.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-recovery-results-and-package
          path: |
            hud-recovery-results.xml
            hud-recovery-soak.json
            package/
  publish:
    name: Publish checked HUD package
    needs: recovery
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/NEXO'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hud-recovery-results-and-package
      - name: Publish immutable HUD release for the 7000 protected updater
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.recovery.outputs.source_commit }}
        run: |
            set -euo pipefail
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            tag="jetson-hud-${SOURCE_COMMIT}"
            test -s package/NEXO-Jetson-HUD-repair.zip
            test -s package/NEXO-Jetson-HUD-repair.zip.sha256
            (cd package && sha256sum -c NEXO-Jetson-HUD-repair.zip.sha256)
            python3 - <<'PY'
            import hashlib, io, json, os, tarfile, zipfile
            with zipfile.ZipFile('package/NEXO-Jetson-HUD-repair.zip') as archive:
              metadata = json.loads(archive.read('nexo-hud-repair.json'))
              payload = archive.read('nexo-hud-repair.tar.gz')
            if (metadata['source_commit'] != os.environ['SOURCE_COMMIT']
                or hashlib.sha256(payload).hexdigest() != metadata['bundle_sha256']):
              raise SystemExit('Tested source/package identity mismatch; release blocked')
            with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as bundle:
              if bundle.extractfile('SOURCE_COMMIT').read().decode().strip() != os.environ['SOURCE_COMMIT']:
                raise SystemExit('Archived source identity mismatch; release blocked')
            PY
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Immutable release already exists: $tag"
            else
              gh release create "$tag" \
                package/NEXO-Jetson-HUD-repair.zip \
                package/NEXO-Jetson-HUD-repair.zip.sha256 \
                --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
                --title "NEXO Jetson HUD ${SOURCE_COMMIT:0:12}" \
                --notes "Automated protected Display Only HUD package built and tested from NEXO. Hardware acceptance remains required." \
                --latest=false
            fi

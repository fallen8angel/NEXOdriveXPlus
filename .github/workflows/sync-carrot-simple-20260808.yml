name: Sync Carrot into NEXO 20260808

on:
  push:
    branches:
      - NEXO
    paths:
      - '.github/carrot-sync-trigger-simple-20260808'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NEXO
        uses: actions/checkout@v4
        with:
          ref: NEXO
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Merge Carrot
        run: bash .github/scripts/sync_carrot_20260808.sh

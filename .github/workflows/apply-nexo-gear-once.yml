name: apply-nexo-gear-once

on:
  push:
    branches:
      - NEXO
    paths:
      - .github/workflows/apply-nexo-gear-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: NEXO
      - name: Apply NexoPilot gear values
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('opendbc_repo/opendbc/car/hyundai/carstate.py')
          text = path.read_text()
          start_marker = '    if self.CP.carFingerprint != CAR.HYUNDAI_NEXO_1ST_GEN:\n'
          end_marker = '      ret.gearShifter = self.gear_shifter\n'

          start = text.find(start_marker)
          if start < 0:
            raise SystemExit('Legacy NEXO gear block start not found; refusing to modify')
          end = text.find(end_marker, start)
          if end < 0:
            raise SystemExit('Legacy NEXO gear block end not found; refusing to modify')
          end += len(end_marker)

          new = (
            '    if self.CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN:\n'
            '      # NEXO values captured from the vehicle: P=0, D=5, N=6, R=7.\n'
            '      gear = cp.vl["EMS20"]["HYDROGEN_GEAR_SHIFTER"]\n'
            '      gear_map = {\n'
            '        0: GearShifter.park,\n'
            '        5: GearShifter.drive,\n'
            '        6: GearShifter.neutral,\n'
            '        7: GearShifter.reverse,\n'
            '      }\n'
            '      if gear in gear_map:\n'
            '        self.gear_shifter = gear_map[gear]\n'
            '      ret.gearShifter = self.gear_shifter\n'
            '    else:\n'
            '      ret.gearShifter = self.parse_gear_shifter(self.shifter_values.get(gear))\n'
          )

          text = text[:start] + new + text[end:]
          path.write_text(text)
          PY
          python -m py_compile opendbc_repo/opendbc/car/hyundai/carstate.py
          grep -A14 -B2 'NEXO values captured from the vehicle' opendbc_repo/opendbc/car/hyundai/carstate.py
      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "fallen8angel"
          git config user.email "75917889+fallen8angel@users.noreply.github.com"
          git rm .github/workflows/apply-nexo-gear-once.yml
          git add opendbc_repo/opendbc/car/hyundai/carstate.py
          git commit -m "Use NexoPilot NEXO gear values"
          git push origin HEAD:NEXO

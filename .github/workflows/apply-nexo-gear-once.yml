name: apply-nexo-gear-once

on:
  push:
    branches:
      - NEXO
    paths:
      - .github/workflows/apply-nexo-gear-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: NEXO
      - name: Apply NexoPilot gear values
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('opendbc_repo/opendbc/car/hyundai/carstate.py')
          text = path.read_text()
          old = '''    if self.CP.carFingerprint != CAR.HYUNDAI_NEXO_1ST_GEN:
              ret.gearShifter = self.parse_gear_shifter(self.shifter_values.get(gear))
            else:
              gear = cp.vl["ELECT_GEAR"]["Elect_Gear_Shifter"]
              gear_disp = cp.vl["ELECT_GEAR"]

              gear_shifter = GearShifter.unknown

              if gear == 1546:  # Thank you for Neokii  # fix PolorBear 22.06.05
                gear_shifter = GearShifter.drive
              elif gear == 2314:
                gear_shifter = GearShifter.neutral
              elif gear == 2569:
                gear_shifter = GearShifter.park
              elif gear == 2566:
                gear_shifter = GearShifter.reverse

              if gear_shifter != GearShifter.unknown and self.gear_shifter != gear_shifter:
                self.gear_shifter = gear_shifter

              ret.gearShifter = self.gear_shifter
          '''
          # Dedent only the Python here-document indentation, not the target source indentation.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'

          new = '''    if self.CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN:
              # NEXO values captured from the vehicle: P=0, D=5, N=6, R=7.
              gear = cp.vl["EMS20"]["HYDROGEN_GEAR_SHIFTER"]
              gear_map = {
                0: GearShifter.park,
                5: GearShifter.drive,
                6: GearShifter.neutral,
                7: GearShifter.reverse,
              }
              if gear in gear_map:
                self.gear_shifter = gear_map[gear]
              ret.gearShifter = self.gear_shifter
            else:
              ret.gearShifter = self.parse_gear_shifter(self.shifter_values.get(gear))
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'

          if old not in text:
            raise SystemExit('Expected legacy NEXO ELECT_GEAR block not found; refusing to modify')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m py_compile opendbc_repo/opendbc/car/hyundai/carstate.py
      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "fallen8angel"
          git config user.email "75917889+fallen8angel@users.noreply.github.com"
          git rm .github/workflows/apply-nexo-gear-once.yml
          git add opendbc_repo/opendbc/car/hyundai/carstate.py
          git commit -m "Use NexoPilot NEXO gear values"
          git push origin HEAD:NEXO

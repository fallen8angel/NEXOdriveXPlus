name: Sync Carrot into NEXO once

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && github.event.comment.body == '/sync-carrot-20260804')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Prepare diagnostics
        shell: bash
        run: |
          : > "$RUNNER_TEMP/sync.log"
          echo "Workflow started at $(date -u +%FT%TZ)" >> "$RUNNER_TEMP/sync.log"

      - name: Checkout NEXO history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: NEXO
          fetch-depth: 50
          submodules: false
          lfs: false
          clean: true

      - name: Merge pinned Carrot update and preserve NEXO customizations
        id: sync
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -o pipefail
          {
            set -Eeuo pipefail
            echo "Checkout outcome: $CHECKOUT_OUTCOME"
            [[ "$CHECKOUT_OUTCOME" == "success" ]] || {
              echo "Repository checkout failed before the merge step."
              exit 1
            }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            BASE_SHA="$(git rev-parse HEAD)"
            CARROT_SHA="83ca66c4cda5f775cfb105c2c5576e2ee5cd6e56"
            echo "NEXO base: $BASE_SHA"
            echo "Pinned Carrot: $CARROT_SHA"

            git remote remove upstream 2>/dev/null || true
            git remote add upstream https://github.com/fallen8angel/openpilot_Carrot.git
            git fetch --no-tags --depth=220 upstream carrot-wip
            git cat-file -e "${CARROT_SHA}^{commit}"

            if git merge-base --is-ancestor "$CARROT_SHA" HEAD; then
              echo "Pinned Carrot commit is already contained in NEXO."
              NEXO_SYNC_SHA="$(git rev-parse HEAD)"
            else
              set +e
              git merge --no-ff --no-commit "$CARROT_SHA"
              MERGE_RC=$?
              set -e

              if [[ "$MERGE_RC" -ne 0 ]]; then
                echo "Merge conflicts detected. Resolving conflicted paths from the Carrot side first."
                while IFS= read -r -d '' path; do
                  echo "Resolving: $path"
                  if git checkout --theirs -- "$path"; then
                    git add -- "$path"
                  else
                    git rm -f -- "$path"
                  fi
                done < <(git diff --name-only --diff-filter=U -z)
              fi

              git checkout "$BASE_SHA" -- nexo_tuning_test.patch
              git checkout "$BASE_SHA" -- opendbc_repo/opendbc/car/hyundai/hyundaican.py

              python - <<'PY'
              from pathlib import Path

              path = Path("openpilot/system/manager/process_config.py")
              text = path.read_text(encoding="utf-8")

              old_hud = '    return params.get_int("ClusterHud") == 1'
              new_hud = '    return params.get_int("ClusterHud") in (1, 2)'
              if old_hud in text:
                text = text.replace(old_hud, new_hud, 1)
              elif new_hud not in text:
                raise SystemExit("ClusterHud NEXO policy location was not found")

              active_push = '  PythonProcess("cweb_push", "openpilot.selfdrive.carrot.cweb_push", always_run, enabled=not PC),'
              disabled_push = '  # Disabled in NEXO branches: do not report device ID/IP/port to the Carrot developer server.\n  # PythonProcess("cweb_push", "openpilot.selfdrive.carrot.cweb_push", always_run, enabled=not PC),'
              if active_push in text:
                text = text.replace(active_push, disabled_push, 1)
              elif '# PythonProcess("cweb_push"' not in text:
                raise SystemExit("cweb_push NEXO policy location was not found")

              required = (
                'PythonProcess("radard", "openpilot.selfdrive.controls.radard", conventional_radard)',
                'PythonProcess("radard_dpath", "openpilot.selfdrive.carrot.radar.radard_dpath", dpath_radard)',
                'return params.get_int("ClusterHud") in (1, 2)',
                '# PythonProcess("cweb_push"',
              )
              for marker in required:
                if marker not in text:
                  raise SystemExit(f"required merged marker missing: {marker}")

              path.write_text(text, encoding="utf-8")
              PY

              # This workflow is intentionally one-time only.
              git rm -f .github/workflows/sync-carrot-once.yml
              git add -A

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved merge conflicts remain:"
                git diff --name-only --diff-filter=U
                exit 1
              fi

              python -m py_compile openpilot/system/manager/process_config.py
              python -m compileall -q openpilot/selfdrive/carrot/radar opendbc_repo/opendbc/car/hyundai
              git diff --check --cached

              git commit -m "Merge latest openpilot_Carrot updates into NEXO"
              NEXO_SYNC_SHA="$(git rev-parse HEAD)"
              git push origin HEAD:NEXO
            fi

            git fetch --no-tags --depth=50 origin NEXO-tuning-test
            git checkout -B NEXO-tuning-test origin/NEXO-tuning-test
            if git merge-base --is-ancestor "$NEXO_SYNC_SHA" HEAD; then
              echo "NEXO-tuning-test already contains the synchronized NEXO commit."
            else
              git merge --no-ff --no-edit "$NEXO_SYNC_SHA"
              git push origin HEAD:NEXO-tuning-test
            fi

            echo "NEXO_SYNC_SHA=$NEXO_SYNC_SHA" >> "$GITHUB_ENV"
            echo "Synchronization completed: $NEXO_SYNC_SHA"
          } 2>&1 | tee -a "$RUNNER_TEMP/sync.log"

      - name: Comment synchronization result
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/sync.log`;
            let log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No diagnostic log file was produced.';
            log = log.slice(-6000).replace(/```/g, '` ` `');
            const sha = process.env.NEXO_SYNC_SHA || 'not created';
            const success = process.env.CHECKOUT_OUTCOME === 'success' && process.env.SYNC_OUTCOME === 'success';
            const body = success
              ? `✅ Carrot 동기화 완료\n\nNEXO 동기화 커밋: \`${sha}\`\nNEXO-tuning-test도 함께 동기화했습니다.`
              : `❌ Carrot 동기화 실패\n\nCheckout: \`${process.env.CHECKOUT_OUTCOME}\`\nSync: \`${process.env.SYNC_OUTCOME}\`\n\n최근 로그:\n\n\`\`\`text\n${log}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail after reporting
        if: steps.checkout.outcome != 'success' || steps.sync.outcome != 'success'
        run: exit 1

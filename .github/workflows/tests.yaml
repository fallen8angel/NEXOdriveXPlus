name: tests

on:
  push:
    branches:
      - carrot-wip
      - NEXO
      - codex/nexo-hud-integration-20261027
  pull_request:
    branches: [NEXO]
  workflow_dispatch:
    inputs:
      n16_arm_acceptance:
        type: boolean
        description: Compare first-frame and 140-frame official N16 results on hosted Arm64
        default: false
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/carrot-wip' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1

jobs:
  n16_arm_cpu_handoff:
    name: N16 CPU handoff on Arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy onnx onnxruntime==1.23.2
      - name: Exercise native CPU graph splitting, recurrence and mismatch detection
        run: python -m pytest -q -c /dev/null --noconftest openpilot/tools/jetson/tests/test_nexo_n16_cpu_plan.py

  n16_official_arm_acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.n16_arm_acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cut: [360, 361]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy onnx onnxruntime==1.23.2
      - name: Fetch pinned public model and Jetlink preprocessing
        run: |
          git clone --quiet https://github.com/ajouatom/carrot-jetson.git "$RUNNER_TEMP/carrot"
          git -C "$RUNNER_TEMP/carrot" checkout --quiet d0dc96fa32410403dfb2fefff3e2909c11ec109b
          mkdir "$RUNNER_TEMP/release"
          ln -s "$RUNNER_TEMP/carrot" "$RUNNER_TEMP/release/carrot-server"
          curl --fail --location --retry 2 --max-time 240 --max-filesize 814591107 \
            https://upload.shind0.synology.me/models/comma4-big-nav-n16-96244b1f/big_driving_supercombo.onnx \
            --output "$RUNNER_TEMP/n16.onnx"
      - name: Compare original, legacy, true-boundary replay and resolved cuts
        run: |
          export PYTHONPATH="$PWD:$RUNNER_TEMP/carrot/third_party/jetlink"
          python tools/ci/n16_cpu_acceptance.py "$RUNNER_TEMP/n16.onnx" "${{ matrix.cut }}" --release "$RUNNER_TEMP/release" \
            | tee "$RUNNER_TEMP/n16-${{ matrix.cut }}.jsonl"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n16-arm-${{ matrix.cut }}-metrics
          path: ${{ runner.temp }}/n16-*.jsonl

  cruise_timing_regression:
    name: Bounded NEXO cruise timing diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install standalone test dependency
        run: python -m pip install pytest
      - name: Check cruise/card syntax and observational timing rollups
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m py_compile openpilot/selfdrive/car/cruise_timing.py openpilot/selfdrive/car/cruise.py openpilot/selfdrive/car/card.py
          python -m pytest -q -c /dev/null --noconftest -o addopts='' openpilot/selfdrive/car/tests/test_cruise_timing.py
  hud_fault_regression:
    name: HUD fault and resource regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest pytest-asyncio aiohttp numpy pillow pycapnp cffi psutil pyzmq zstandard opencv-python-headless
      - name: Verify read-only Jetson AI, SSH and LTE diagnosis
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/opendbc_repo'
        run: |
          python -m py_compile openpilot/tools/jetson/ssh_preflight.py openpilot/tools/jetson/lte_share.py openpilot/selfdrive/carrot/server/services/jetson_ai_failure_report.py openpilot/selfdrive/carrot/server/services/jetson_offroad_trial_report.py openpilot/selfdrive/carrot/server/features/jetson.py openpilot/selfdrive/carrot/server/features/jetson_pages.py
          python -m pytest -q --noconftest -o addopts='' -o asyncio_mode=auto openpilot/tools/jetson/tests/test_ssh_preflight.py openpilot/tools/jetson/tests/test_lte_share.py openpilot/selfdrive/carrot/server/tests/test_jetson_ai_failure_report.py openpilot/selfdrive/carrot/server/tests/test_jetson_offroad_trial_report.py
      - name: Prepare existing pinned Jetson source
        run: |
          git clone --filter=blob:none https://github.com/ajouatom/carrot-jetson.git /tmp/carrot-jetson
          git -C /tmp/carrot-jetson checkout d0dc96fa32410403dfb2fefff3e2909c11ec109b
      - name: Test HUD faults, TCP sessions, GPS isolation and EGL cleanup
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/opendbc_repo'
          CARROT_JETSON: /tmp/carrot-jetson
        run: >-
          python -m pytest -q -o addopts='' -o asyncio_mode=auto
          --confcutdir=openpilot/tools/jetson/tests
          openpilot/tools/jetson/tests/test_hud_observations.py
          openpilot/tools/jetson/tests/test_hud_link_soak.py
          openpilot/tools/jetson/tests/test_hud_signal_filter.py
          openpilot/tools/jetson/tests/test_hud_signals.py
          openpilot/tools/jetson/tests/test_bench_hud_freshness.py
          openpilot/tools/jetson/tests/test_hud_snapshot_recovery.py
          openpilot/tools/jetson/tests/test_ncm_display.py
          openpilot/selfdrive/carrot/server/tests/test_nexo_hud_link_log.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_updater.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_check_diagnostics.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_performance.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_ai_performance.py
          openpilot/selfdrive/carrot/server/tests/test_feature_imports.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_hud_stage_labels.py
          openpilot/selfdrive/carrot/server/tests/test_jetson_clock_sync.py
          openpilot/selfdrive/carrot/server/tests/test_hud_update_safety.py
          openpilot/tools/jetson/tests/test_hud_park_mode.py
          openpilot/tools/jetson/tests/test_gear_reverse_overlay.py
          openpilot/tools/jetson/tests/test_nexo_hydrogen_probe.py
          openpilot/selfdrive/ui/tests/test_egl_shutdown.py
          openpilot/system/manager/test/test_python_process_spawn.py
          --junitxml=hud-fault-results.xml
      - name: Localhost soak and software encoder benchmark
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/opendbc_repo'
          CARROT_JETSON: /tmp/carrot-jetson
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m openpilot.tools.jetson.bench_hud_local --seconds 120 --output hud-local-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-fault-results
          path: |
            hud-fault-results.xml
            hud-local-benchmark.json
  build_release:
    name: build release
    runs-on: ubuntu-24.04
    env:
      CARROT_JETSON: /tmp/carrot-jetson
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: ./tools/op.sh setup
      - name: Install optional Jetson test dependency
        run: |
          uv pip install onnx onnxruntime==1.23.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare existing pinned Jetson source
        run: |
          git clone --filter=blob:none https://github.com/ajouatom/carrot-jetson.git "$CARROT_JETSON"
          git -C "$CARROT_JETSON" checkout d0dc96fa32410403dfb2fefff3e2909c11ec109b
      - name: Build openpilot
        id: build
        run: scons
      - name: Test Hyundai forwarding timer safety hooks
        run: pytest -q -ra -o addopts='' --confcutdir=opendbc_repo/opendbc/safety/tests opendbc_repo/opendbc/safety/tests/test_hyundai_forwarding_timer.py --junitxml=regression-safety.xml
      - name: Test optional NEXO Jetson integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pytest -q -ra -o asyncio_mode=auto openpilot/tools/jetson/tests openpilot/selfdrive/modeld/tests/test_jetlink_startup.py openpilot/selfdrive/modeld/tests/test_jetlink_ncm_server.py openpilot/common/tests/test_stopping_params.py openpilot/selfdrive/carrot/server/tests/test_jetson_link_observer.py openpilot/selfdrive/carrot/server/tests/test_jetson_diagnostics.py openpilot/selfdrive/carrot/server/tests/test_nexo_diag_quality.py openpilot/selfdrive/carrot/tests/test_driving_mode_detector.py openpilot/selfdrive/carrot/tests/test_radar_motion_predictor.py --junitxml=regression-integration.xml
      - name: Test existing optical signal observer with synthetic images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pytest -q -ra -o addopts='' openpilot/selfdrive/modeld/tests/test_nexo_action_curvature.py openpilot/selfdrive/modeld/tests/test_signal_color_shadow.py openpilot/selfdrive/modeld/tests/test_signal_tracking_shadow.py tools/signal_analysis/test_signal_tracker.py --junitxml=regression-signal-observer.xml
      - name: Test unchanged NEXO sensor and HUD presentation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pytest -q -ra openpilot/selfdrive/carrot/tests/test_nexo_sensor_log.py openpilot/selfdrive/carrot/tests/test_cluster_blindspot_road.py openpilot/selfdrive/carrot/tests/test_cluster_parking.py openpilot/selfdrive/carrot/tests/test_cluster_side_camera.py openpilot/selfdrive/carrot/tests/test_cluster_software_h264_mirror.py --junitxml=regression-presentation.xml
      - name: Test long-session HUD evidence and encoder compatibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # The vendored comma FFmpeg omits the raw h264 muxer used by HUD.
          # Exercise the installed complete software encoder, not that subset.
          NEXO_TEST_FFMPEG: /usr/bin/ffmpeg
        run: pytest -q -ra openpilot/selfdrive/carrot/server/tests/test_nexo_hud_link_log.py openpilot/selfdrive/carrot/tests/test_cluster_ffmpeg_threads.py openpilot/selfdrive/ui/tests/test_egl_shutdown.py openpilot/system/manager/test/test_python_process_spawn.py --junitxml=regression-resources.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-results
          path: regression-*.xml

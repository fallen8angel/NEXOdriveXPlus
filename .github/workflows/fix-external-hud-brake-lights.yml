name: Fix external HUD brake lights

on:
  push:
    branches: [NEXO]
    paths:
      - '.github/workflows/fix-external-hud-brake-lights.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEXO
      - name: Patch brake light data path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_models.py',
              '    throttle: float = 0.0\n    brake: float = 0.0\n    model_path:',
              '    throttle: float = 0.0\n    brake: float = 0.0\n    brake_lights: bool = False\n    model_path:',
          )

          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_live.py',
              '            urea_gauge=urea_gauge,\n            driving_mode=driving_mode,',
              '            urea_gauge=urea_gauge,\n            brake_lights=bool(safe_get(car_state, "brakePressed", False)),\n            driving_mode=driving_mode,',
          )

          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_scene.py',
              '    primary: bool = False\n    annotate: bool = False\n',
              '    primary: bool = False\n    annotate: bool = False\n    brake_lights: bool = False\n',
          )
          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_scene.py',
              '        target_offset,\n    )\n    show_ego_vehicle =',
              '        target_offset,\n    )\n    ego_vehicle = replace(ego_vehicle, brake_lights=state.brake_lights)\n    show_ego_vehicle =',
          )

          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_renderer.py',
              '            self._draw_vehicle_shadow(vehicle)\n            self._draw_vehicle_model(vehicle)\n            return',
              '            self._draw_vehicle_shadow(vehicle)\n            self._draw_vehicle_model(vehicle)\n            if vehicle.brake_lights:\n                self._draw_vehicle_brake_lights(vehicle)\n            return',
          )
          replace_once(
              'openpilot/selfdrive/carrot/cluster/cluster_renderer.py',
              '        finally:\n            rl.rl_enable_backface_culling()\n\n    def _draw_vehicle_badges(',
              '''        finally:\n            rl.rl_enable_backface_culling()\n\n    def _draw_vehicle_brake_lights(self, vehicle: VehicleBox) -> None:\n        # Overlay the live ego brake lamp on the model rear light strip.\n        half_width = vehicle.width_m * 0.40\n        rear_offset = -vehicle.length_m * 0.501\n        light_bottom = 0.035 + vehicle.height_m * 0.742\n        light_top = 0.035 + vehicle.height_m * 0.767\n\n        def rear_point(local_x: float, z: float) -> Vec3:\n            return Vec3(\n                vehicle.center.x + vehicle.right_x * local_x + vehicle.forward_x * rear_offset,\n                vehicle.center.y + vehicle.right_y * local_x + vehicle.forward_y * rear_offset,\n                z,\n            )\n\n        self._draw_quad(\n            rear_point(-half_width, light_bottom),\n            rear_point(half_width, light_bottom),\n            rear_point(half_width, light_top),\n            rear_point(-half_width, light_top),\n            (255, 28, 20, 255),\n        )\n\n    def _draw_vehicle_badges(''',
          )
          PY
      - name: Syntax check
        run: |
          python -m py_compile \
            openpilot/selfdrive/carrot/cluster/cluster_models.py \
            openpilot/selfdrive/carrot/cluster/cluster_live.py \
            openpilot/selfdrive/carrot/cluster/cluster_scene.py \
            openpilot/selfdrive/carrot/cluster/cluster_renderer.py
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-external-hud-brake-lights.yml
          git config user.name 'ChatGPT GitHub automation'
          git config user.email 'actions@users.noreply.github.com'
          git add openpilot/selfdrive/carrot/cluster/cluster_models.py \
                  openpilot/selfdrive/carrot/cluster/cluster_live.py \
                  openpilot/selfdrive/carrot/cluster/cluster_scene.py \
                  openpilot/selfdrive/carrot/cluster/cluster_renderer.py \
                  .github/workflows/fix-external-hud-brake-lights.yml
          git commit -m 'Fix external HUD brake lights from brakePressed'
          git push origin HEAD:NEXO

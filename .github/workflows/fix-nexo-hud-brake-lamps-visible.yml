name: Fix NEXO HUD brake lamp visibility

on:
  push:
    branches: [NEXO]
    paths:
      - '.github/workflows/fix-nexo-hud-brake-lamps-visible.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEXO
      - name: Make brake lamp overlay visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('openpilot/selfdrive/carrot/cluster/cluster_renderer.py')
          text = p.read_text()
          replacements = {
              'half_width = vehicle.width_m * 0.40': 'half_width = vehicle.width_m * 0.44',
              'rear_offset = -vehicle.length_m * 0.501': 'rear_offset = -vehicle.length_m * 0.515',
              'light_bottom = 0.035 + vehicle.height_m * 0.742': 'light_bottom = 0.035 + vehicle.height_m * 0.47',
              'light_top = 0.035 + vehicle.height_m * 0.767': 'light_top = 0.035 + vehicle.height_m * 0.61',
              '(255, 28, 20, 255),': '(255, 18, 10, 255),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected renderer text not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Syntax check
        run: python -m py_compile openpilot/selfdrive/carrot/cluster/cluster_renderer.py
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-nexo-hud-brake-lamps-visible.yml
          git config user.name 'ChatGPT GitHub automation'
          git config user.email 'actions@users.noreply.github.com'
          git add openpilot/selfdrive/carrot/cluster/cluster_renderer.py .github/workflows/fix-nexo-hud-brake-lamps-visible.yml
          git commit -m 'Fix NEXO external HUD brake lamp visibility'
          git push origin HEAD:NEXO

name: Fix NEXO HUD brake lamps

on:
  push:
    branches:
      - NEXO
    paths:
      - .github/workflows/fix-nexo-hud-brake-lamps-visible.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEXO
      - name: Patch renderer
        run: |
          python -c "from pathlib import Path; import base64; p=Path('openpilot/selfdrive/carrot/cluster/cluster_renderer.py'); s=p.read_text(); a=s.index('    def _draw_vehicle_brake_lights(self, vehicle: VehicleBox) -> None:'); b=s.index('    def _draw_vehicle_badges(', a); n=base64.b64decode('').decode(); p.write_text(s[:a]+n+s[b:])"
          python -m py_compile openpilot/selfdrive/carrot/cluster/cluster_renderer.py
      - name: Commit
        run: |
          git config user.name "ChatGPT GitHub automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/fix-nexo-hud-brake-lamps-visible.yml
          git add openpilot/selfdrive/carrot/cluster/cluster_renderer.py .github/workflows/fix-nexo-hud-brake-lamps-visible.yml
          git commit -m "Fix NEXO external HUD brake lamp visibility"
          git push origin HEAD:NEXO

name: Sync Carrot into NEXO 20260811

on:
  push:
    branches:
      - NEXO
    paths:
      - '.github/carrot-sync-trigger-manual-20260811'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXO
        uses: actions/checkout@v4
        with:
          ref: NEXO
          fetch-depth: 0
      - name: Merge latest Carrot and validate NEXO protections
        run: bash .github/scripts/sync_carrot_manual_20260811.sh
